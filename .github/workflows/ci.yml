name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build-test-release:
    name: Build, Test, Release Build
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Release safety tests verify reviewed commits in the repository history.
          fetch-depth: 0

      - name: Show Swift Version
        run: swift --version

      - name: Build
        run: swift build --force-resolved-versions

      - name: Test
        run: swift test --force-resolved-versions --enable-code-coverage

      - name: Verify source coverage
        run: bash scripts/coverage-check.sh

      - name: Verify CLI reference and examples
        run: |
          ruby scripts/generate-reference.rb .build/debug/clings --check
          ruby scripts/cli-contract-check.rb .build/debug/clings
          bash scripts/release-docs-check.sh

      - name: Verify release safety gates
        run: |
          bash scripts/tests/release-preflight-test.sh
          bash scripts/tests/release-ci-test.sh
          bash scripts/tests/release-assets-test.sh

      - name: Build Release
        run: swift build -c release --force-resolved-versions
